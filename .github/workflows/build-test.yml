name: CI

on: [push, pull_request]

permissions: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check out source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: npm
    - name: Build the frontend
      # cmd/webserver embeds internal/webui/dist via //go:embed. Mirror the
      # Toolforge deploy build (toolforge.yaml, issue #100): the Node buildpack
      # runs npm ci -> npm run build -> npm prune before the Go build. Run the
      # same three so any tree change they cause (which would make the Go build
      # stamp the version "-modified") fails here, not in production.
      run: |
          npm ci
          npm run build
          NODE_ENV=production npm prune
          test -f internal/webui/dist/index.html
          # The frontend build must leave a clean tree: no tracked file changed
          # (esp. package-lock.json, which an npm version skew can rewrite) and
          # no built asset staged (dist/.gitignore keeps those out).
          git diff --exit-code
          test -z "$(git status --porcelain)"
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Build
      # No -X version flags: the version is compiled in from
      # internal/version (internal/version/release.go + the embedded VCS
      # revision), which is also what the Toolforge buildpack build gets.
      run: |
          go build -o artifacts/builder -ldflags="-s -w" -v ./cmd/osmviews-builder
          go build -o artifacts/webserver -ldflags="-s -w" -v ./cmd/webserver
    - name: Test
      run: go test -v ./...
    - name: Validate the CycloneDX BOM against the specification
      # cmd/osmviews-builder/bom.go generates the BOM; the golden test fixture
      # is a representative instance kept byte-identical by TestWriteBOM_Golden.
      # Validating it here checks the generator's output against the spec.
      env:
        # cyclonedx/cyclonedx-cli:0.33.1
        CYCLONEDX_CLI: cyclonedx/cyclonedx-cli@sha256:9a37575fb51fcaed3a4c62dddba091c46ffc867712e46bdb6cdf219a7e90a061
      run: |
          docker run --rm --volume "$PWD/cmd/osmviews-builder/testdata:/bom:ro" \
            "$CYCLONEDX_CLI" \
            validate --input-file /bom/bom.golden.cdx.json --fail-on-errors

  # On a release tag (vX.Y.Z, pushed by release-please), ask the Toolforge
  # components API to rebuild the image and recreate the components
  # (see toolforge.yaml, RELEASING.md).
  deploy:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Trigger and await the Toolforge deployment
      env:
        TOKEN: ${{ secrets.TOOLS_DEPLOY_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        api="https://api.svc.toolforge.org/components/v1/tool/osmviews/deployment"
        body=$(jq -n --arg d "release $TAG" '{description: $d}')
        resp=$(curl --fail-with-body -sS -X POST --json "$body" "$api?token=$TOKEN")
        echo "$resp" | jq .
        id=$(echo "$resp" | jq -r '.data.deploy_id')
        echo "deployment: $id"
        for _ in $(seq 1 80); do
          sleep 15
          status=$(curl --fail-with-body -sS "$api/$id?token=$TOKEN" | jq -r '.data.status')
          echo "status: $status"
          case "$status" in
            pending|running) ;;
            successful) echo "deployed $TAG"; exit 0 ;;
            *) echo "deployment $status"; exit 1 ;;
          esac
        done
        echo "gave up waiting for deployment $id"
        exit 1
