name: CI

on: [push, pull_request]

permissions: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check out source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Build
      run: |
          go build -o artifacts/builder -ldflags="-s -w -X main.SoftwareVersion=OSMViews/${{github.ref_name}}" -v ./cmd/osmviews-builder
          go build -o artifacts/webserver -ldflags="-s -w -X main.ServerVersion=OSMViews/${{github.ref_name}}" -v ./cmd/webserver
    - name: Test
      run: go test -v ./...

  # On a release tag, ask the Toolforge components API to rebuild the image
  # and recreate the components (see toolforge.yaml, docs/release.md).
  deploy:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Trigger and await the Toolforge deployment
      env:
        TOKEN: ${{ secrets.TOOLS_DEPLOY_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        api="https://api.svc.toolforge.org/components/v1/tool/osmviews/deployment"
        body=$(jq -n --arg d "release $TAG" '{description: $d}')
        resp=$(curl --fail-with-body -sS -X POST --json "$body" "$api?token=$TOKEN")
        echo "$resp" | jq .
        id=$(echo "$resp" | jq -r '.data.deploy_id')
        echo "deployment: $id"
        for _ in $(seq 1 80); do
          sleep 15
          status=$(curl --fail-with-body -sS "$api/$id?token=$TOKEN" | jq -r '.data.status')
          echo "status: $status"
          case "$status" in
            pending|running) ;;
            successful) echo "deployed $TAG"; exit 0 ;;
            *) echo "deployment $status"; exit 1 ;;
          esac
        done
        echo "gave up waiting for deployment $id"
        exit 1
