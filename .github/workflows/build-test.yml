name: CI

on:
  push:
  pull_request:
  # Weekly, so newly published vulnerabilities (make vulncheck) surface even
  # when nothing is pushed.
  schedule:
    - cron: "17 5 * * 1"

permissions: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Check out source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Build
      # No -X version flags: the version is compiled in from
      # internal/version (internal/version/release.go + the embedded VCS
      # revision), which is also what the Toolforge buildpack build gets.
      run: make build
    - name: Install golangci-lint
      # A pinned release binary, verified by its SHA-256, rather than
      # golangci/golangci-lint-action: this repository only allows actions
      # by GitHub and verified creators. Keep the version in sync with
      # CONTRIBUTING.md.
      env:
        VERSION: 2.14.0
        SHA256: ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab
      run: |
          set -euo pipefail
          name="golangci-lint-$VERSION-linux-amd64"
          curl -sSfL -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/golangci/golangci-lint/releases/download/v$VERSION/$name.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
    - name: Lint
      run: make lint
    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
    - name: Check for known vulnerabilities
      run: make vulncheck
    - name: Test
      run: make test
    - name: Validate the data package against the Frictionless v2 profile
      run: make check-datapackage
    - name: Validate the CycloneDX BOM against the specification
      # cmd/osmviews-builder/bom.go generates the BOM; the golden test fixture
      # is a representative instance kept byte-identical by TestWriteBOM_Golden.
      # Validating it here checks the generator's output against the spec.
      env:
        # cyclonedx/cyclonedx-cli:0.33.1
        CYCLONEDX_CLI: cyclonedx/cyclonedx-cli@sha256:9a37575fb51fcaed3a4c62dddba091c46ffc867712e46bdb6cdf219a7e90a061
      run: |
          docker run --rm --volume "$PWD/cmd/osmviews-builder/testdata:/bom:ro" \
            "$CYCLONEDX_CLI" \
            validate --input-file /bom/bom.golden.cdx.json --fail-on-errors

  # On a release tag (vX.Y.Z, pushed by release-please), ask the Toolforge
  # components API to rebuild the image and recreate the components
  # (see toolforge.yaml, RELEASING.md).
  deploy:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Trigger and await the Toolforge deployment
      env:
        TOKEN: ${{ secrets.TOOLS_DEPLOY_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        api="https://api.svc.toolforge.org/components/v1/tool/osmviews/deployment"
        body=$(jq -n --arg d "release $TAG" '{description: $d}')
        resp=$(curl --fail-with-body -sS -X POST --json "$body" "$api?token=$TOKEN")
        echo "$resp" | jq .
        id=$(echo "$resp" | jq -r '.data.deploy_id')
        echo "deployment: $id"
        for _ in $(seq 1 80); do
          sleep 15
          status=$(curl --fail-with-body -sS "$api/$id?token=$TOKEN" | jq -r '.data.status')
          echo "status: $status"
          case "$status" in
            pending|running) ;;
            successful) echo "deployed $TAG"; exit 0 ;;
            *) echo "deployment $status"; exit 1 ;;
          esac
        done
        echo "gave up waiting for deployment $id"
        exit 1
