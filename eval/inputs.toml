#
# Every input of the evaluation, pinned by URL and SHA-256. `make` downloads
# each one once into the cache directory and refuses a file whose checksum
# does not match. An input whose url is still empty must be given as a local
# file through the environment variable named in `env`, which also overrides
# a pinned url for experiments.
#
# Several sources keep only recent files: osmviews.brawer.ch keeps the
# three latest GeoTIFFs, dumps.wikimedia.org about five months of dumps,
# and the World Bank and QRank URLs serve the latest data. The inputs are
# therefore archived on Zenodo with the paper; use that archive once these
# URLs stop matching their checksums.

[osmviews]
description = "Regular OSMViews GeoTIFF of the evaluated release"
url = "https://osmviews.brawer.ch/data/osmviews-20261011.tiff"
sha256 = "c7766c9c81853400c308453e80326e427076d56211a160b71e32fcaf055b79dd"
env = "OSMVIEWS_TIFF"

[osmviews-previous-1]
description = "Regular OSMViews GeoTIFF one week before the evaluated release"
url = "https://osmviews.brawer.ch/data/osmviews-20261004.tiff"
sha256 = "e9bbd71460e0022b057ef5702e79fc2fe96ff789fd550a5aaf86bb09e96405fe"
env = "OSMVIEWS_PREVIOUS_1_TIFF"

[osmviews-previous-2]
description = "Regular OSMViews GeoTIFF two weeks before the evaluated release"
url = "https://osmviews.brawer.ch/data/osmviews-20260927.tiff"
sha256 = "33b72b42a228a4667a4cbd86b4a70889577b9c55ac3df14569b8acd4506885ff"
env = "OSMVIEWS_PREVIOUS_2_TIFF"

[osmviews-filtered]
description = "Experimental OSMViews GeoTIFF with zoom filter v2 (lanes, Null Island)"
url = ""     # data/experimental/osmviews-<date>-filtered.tiff of the same release
sha256 = ""
env = "OSMVIEWS_FILTERED_TIFF"
optional = true  # evaluations of the filter are skipped without it

[ghsl-pop]
description = "GHS-POP R2023A, population for 2025 at 30 arc seconds (European Commission JRC, CC BY 4.0)"
url = "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/GHSL/GHS_POP_GLOBE_R2023A/GHS_POP_E2025_GLOBE_R2023A_4326_30ss/V1-0/GHS_POP_E2025_GLOBE_R2023A_4326_30ss_V1_0.zip"
sha256 = "752626a5bbe6f9d0cf79ac33a3cac3572234952b98b5113a4cc01a6bd2d30383"
env = "GHSL_POP_ZIP"

[viirs-flux]
description = "Annual night-light radiant flux 2024 from SNPP-VIIRS VNL, at 15 arc seconds (Zeng, Jia, Zhao; CC BY 4.0)"
url = "https://zenodo.org/records/17847442/files/radiantflux2024.zip"
sha256 = "28d034a2456a0e251403fb4abadf0131f5e34b8aba374a2b94431f64e6fc2f92"
env = "VIIRS_FLUX_ZIP"

[commons-geotags]
