#
# Toolforge "components" deployment config.
# https://wikitech.wikimedia.org/wiki/Help:Toolforge/Deploy_your_tool
#
# One buildpack image is built from this repository and run as two
# components: the public web server (a continuous job, published at
# https://osmviews.toolforge.org/) and the data-processing pipeline
# (a daily scheduled job). CI redeploys on each release tag with
#   POST https://api.svc.toolforge.org/components/v1/tool/osmviews/deployment
# See docs/release.md.

# yaml-language-server: $schema=https://gitlab.wikimedia.org/repos/cloud/toolforge/components-api/-/raw/main/openapi/tool-config-schema.json
config_version: v1beta1
source_url: https://raw.githubusercontent.com/brawer/osmviews/main/toolforge.yaml

components:
  webserver:
    component_type: continuous
    build:
      repository: https://github.com/brawer/osmviews
      ref: main
    run:
      # Absolute path: the buildpack image does not put the binaries on
      # PATH (Wikimedia T363417), which is also why the Procfile spells
      # them out.
      command: /layers/heroku_go/go_target/bin/webserver --port 8000
      publish: "/" # serves https://osmviews.toolforge.org/
      port: 8000
      replicas: 1
      mount: none # rebuilds its local cache from object storage on start
      health_check_http: /robots.txt
      cpu: "1"
      memory: 512M

  osmviews-builder:
    component_type: scheduled
    build:
      reuse_from: webserver
    run:
      command: /layers/heroku_go/go_target/bin/osmviews-builder
      schedule: "@daily"
      # mount: none has handled the full zoom-18 paint in ~800 MiB (see
      # docs/technical-design.md); bump to "all" with an explicit
      # --workdir if ephemeral disk ever becomes the limit.
      mount: none
      retry: 0
      cpu: "2"
      memory: 3G
      emails: onfailure
