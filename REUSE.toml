version = 1

# The root LICENSE file duplicates LICENSES/MIT.txt so that GitHub, whose
# license detection is unreliable at finding LICENSES/, still recognises it.
[[annotations]]
path = "LICENSE"
SPDX-FileCopyrightText = "2026 Sascha Brawer <sascha@brawer.ch>"
SPDX-License-Identifier = "MIT"

# release-please's config and manifest are JSON, which cannot carry an SPDX
# header comment; the manifest is also rewritten by the bot on every release.
[[annotations]]
path = [
    "release-please-config.json",
    ".release-please-manifest.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sascha Brawer <sascha@brawer.ch>"
SPDX-License-Identifier = "MIT"


# Screenshot of the OSMViews map app (https://osmviews.brawer.ch). PNG cannot
# carry an SPDX header comment. The handful of basemap labels it shows
# (OpenFreeMap / OpenMapTiles, from OpenStreetMap data) are incidental.
[[annotations]]
path = "docs/osmviews.png"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sascha Brawer <sascha@brawer.ch>"
SPDX-License-Identifier = "CC0-1.0"
