version = 1

# The root LICENSE file duplicates LICENSES/MIT.txt so that GitHub, whose
# license detection is unreliable at finding LICENSES/, still recognises it.
[[annotations]]
path = "LICENSE"
SPDX-FileCopyrightText = "2026 Sascha Brawer <sascha@brawer.ch>"
SPDX-License-Identifier = "MIT"

# release-please's config and manifest are JSON, which cannot carry an SPDX
# header comment; the manifest is also rewritten by the bot on every release.
[[annotations]]
path = [
    "release-please-config.json",
    ".release-please-manifest.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sascha Brawer <sascha@brawer.ch>"
SPDX-License-Identifier = "MIT"

# Frontend manifests (see package.json, internal/webui): JSON and a bare version
# string, none of which can carry an SPDX header comment. package-lock.json is
# regenerated by npm. The bundled npm dependencies live under node_modules/,
# which is git-ignored and never distributed (the Toolforge buildpack rebuilds
# it); their own licences travel with them there.
[[annotations]]
path = [
    "package.json",
    "package-lock.json",
    ".node-version",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Sascha Brawer <sascha@brawer.ch>"
SPDX-License-Identifier = "MIT"
